name: Publier JHD Link Manager

on:
  push:
    branches: [main]
    paths:
      - 'links.json'
      - 'build.py'
      - 'manager.html'
      - 'manage_links.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la syntaxe Python
        run: python -m py_compile build.py manage_links.py
      - name: Générer les liens
        run: python build.py
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
